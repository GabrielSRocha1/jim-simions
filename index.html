<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jim Simions</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/GvXMNKym/image.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #030305;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(188, 0, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 255, 0.08) 0%, transparent 40%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Performance Optimization: GPU acceleration for containers */
        .aggressive-mode {
            background-color: #080300 !important;
            transition: background-color 1s ease;
        }
        
        .contain-paint { contain: paint; }
        .contain-layout { contain: layout; }
        .contain-content { contain: content; }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transform: translateZ(0); /* Force GPU */
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom Slider Styling */
        input[type=range] {
          -webkit-appearance: none;
          background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
          width: 100%;
          height: 4px;
          cursor: pointer;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 10px;
        }
        input[type=range]::-webkit-slider-thumb {
          height: 20px;
          width: 20px;
          border-radius: 50%;
          background: #00f2ff;
          cursor: pointer;
          -webkit-appearance: none;
          margin-top: -8px;
          box-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
          border: 3px solid #030305;
        }
        
        .text-neon-green {
            color: #10b981;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
        }

        .cta-glow {
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            background: linear-gradient(90deg, #00f2ff, #0072ff);
            color: #030305;
            font-weight: 800;
        }
        .cta-glow:hover {
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.4);
            transform: translateY(-2px) scale(1.02);
        }
        .cta-glow::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            transform: scale(0);
            transition: transform 0.6s ease-out;
            pointer-events: none;
        }
        .cta-glow:hover::after {
            transform: scale(1);
        }

        .text-gradient-cyan {
            background: linear-gradient(to right, #00f2ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }
            50% { box-shadow: 0 0 25px rgba(0, 242, 255, 0.4); }
            100% { box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }
        }
        .pulse-glow {
            animation: pulse-glow 3s infinite;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body class="text-white">
    <div id="root"></div>
    <!-- Ponto de entrada do script React -->
    <script type="module" src="./index.tsx"></script>
</body>
</html>
